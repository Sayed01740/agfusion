name: Temporary typecheck report

on:
  push:
    branches: [restore/last-known-green]

permissions:
  contents: write

jobs:
  report:
    if: ${{ !contains(github.event.head_commit.message, '[type-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/last-known-green
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          npm run typecheck > TYPECHECK_REPORT.txt 2>&1
          status=$?
          echo "\nEXIT_CODE=$status" >> TYPECHECK_REPORT.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add TYPECHECK_REPORT.txt
          git commit -m 'chore: capture current typecheck report [type-report]' || true
          git push origin HEAD:restore/last-known-green || true
          exit 0
