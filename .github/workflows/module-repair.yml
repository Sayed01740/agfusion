name: One-time module resolver repair

on:
  push:
    branches: [restore/last-known-green]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[module-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore/last-known-green
          fetch-depth: 0
      - name: Rename bridge modules to stable unique paths
        shell: bash
        run: |
          set -e
          cp src/lib/cctp-chains.ts src/lib/cctp-config.ts
          cp src/lib/bridge-debug.ts src/lib/bridge-debug-v5.ts
          grep -RIl --exclude-dir=node_modules --exclude-dir=.git '@/lib/cctp-chains' src | xargs -r sed -i 's#@/lib/cctp-chains#@/lib/cctp-config#g'
          grep -RIl --exclude-dir=node_modules --exclude-dir=.git '@/lib/bridge-debug' src | xargs -r sed -i 's#@/lib/bridge-debug#@/lib/bridge-debug-v5#g'
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tsconfig.json')
          data = json.loads(p.read_text())
          paths = data['compilerOptions']['paths']
          paths.pop('@/lib/cctp-chains', None)
          paths.pop('@/lib/bridge-debug', None)
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tsconfig.json
          git commit -m 'fix: stabilize bridge module resolution [module-repair]'
          git push origin HEAD:restore/last-known-green
