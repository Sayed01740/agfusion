name: Refresh patched dependency lockfile

on:
  push:
    branches:
      - feat/arc-mainnet-isolated
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.repository == 'Sayed01740/agfusion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arc-mainnet-isolated
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply non-breaking security fixes to lockfile
        run: npm audit fix --package-lock-only --legacy-peer-deps || echo "Some advisories may remain; preserving any compatible lockfile fixes for review."
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh patched dependency lockfile"
          git push origin "HEAD:feat/arc-mainnet-isolated"
