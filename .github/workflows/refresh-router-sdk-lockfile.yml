name: Refresh router SDK lockfile

on:
  push:
    branches:
      - feature/arc-mainnet-swap-support-20261106
    paths:
      - package.json
      - .github/workflows/refresh-router-sdk-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile without running package scripts
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Audit dependency tree
        run: npm audit
      - name: Commit updated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh lockfile for Universal Router SDK"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
