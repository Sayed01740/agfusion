name: Repair Cloudflare OpenNext build configuration

on:
  push:
    branches:
      - feature/arc-quote-session-d1-worker-20261109
    paths:
      - .github/workflows/repair-cloudflare-build.yml

permissions:
  contents: write

concurrency:
  group: agfusion-cloudflare-build-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/arc-quote-session-d1-worker-20261109
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure OpenNext and Wrangler
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          p.devDependencies = p.devDependencies || {};
          p.devDependencies["@opennextjs/cloudflare"] = "1.20.16";
          p.devDependencies.wrangler = "4.158.0";
          delete p.dependencies["@opennextjs/cloudflare"];
          p.overrides = p.overrides || {};
          p.overrides.glob = "14.0.4";
          p.scripts.preview = "opennextjs-cloudflare build && opennextjs-cloudflare preview";
          p.scripts.deploy = "opennextjs-cloudflare build && opennextjs-cloudflare deploy";
          p.scripts.upload = "opennextjs-cloudflare build && opennextjs-cloudflare upload";
          p.scripts["cf-typegen"] = "wrangler types --env-interface CloudflareEnv cloudflare-env.d.ts";
          fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");

          const wrangler = {
            "$schema": "node_modules/wrangler/config-schema.json",
            "main": ".open-next/worker.js",
            "name": "agfusion",
            "compatibility_date": "2026-11-09",
            "compatibility_flags": ["global_fetch_strictly_public"],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "services": [
              {
                "binding": "WORKER_SELF_REFERENCE",
                "service": "agfusion"
              }
            ],
            "images": {
              "binding": "IMAGES"
            },
            "observability": {
              "enabled": true
            }
          };
          fs.writeFileSync("wrangler.jsonc", JSON.stringify(wrangler, null, 2) + "\n");
          NODE

          printf 'legacy-peer-deps=true\n' > .npmrc
          printf '22\n' > .node-version

          cat > open-next.config.ts <<'EOF'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";

          export default defineCloudflareConfig({});
          EOF

          cat >> .gitignore <<'EOF'

          # OpenNext
          .open-next

          # Wrangler local files
          .wrangler
          .dev.vars*
          !.dev.vars.example
          EOF

          if ! grep -q "initOpenNextCloudflareForDev" next.config.js; then
            printf '\nimport("@opennextjs/cloudflare").then(m => m.initOpenNextCloudflareForDev());\n' >> next.config.js
          fi

          mkdir -p public
          cat > public/_headers <<'EOF'
          # Cache immutable Next.js build assets at the edge.
          # https://developers.cloudflare.com/workers/static-assets/headers
          /_next/static/*
            Cache-Control: public,max-age=31536000,immutable
          EOF

      - name: Regenerate lockfile and install cleanly
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps
          npm ci --legacy-peer-deps

      - name: Audit dependencies
        run: npm audit

      - name: Verify elliptic regression vectors
        run: npm run test:elliptic-leading-zero

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Commit verified Cloudflare build configuration
        shell: bash
        run: |
          rm -f .github/workflows/repair-cloudflare-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore .npmrc .node-version next.config.js package.json package-lock.json open-next.config.ts wrangler.jsonc public/_headers
          git add -u .github/workflows/repair-cloudflare-build.yml
          git commit -m "fix: configure reproducible Cloudflare OpenNext builds"
          git push origin HEAD:feature/arc-quote-session-d1-worker-20261109
