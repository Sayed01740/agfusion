name: Arc Mainnet preflight script validation

on:
  push:
    branches:
      - feat/arc-mainnet-isolated
    paths:
      - "scripts/verify-arc-mainnet.mjs"
      - ".github/workflows/arc-mainnet-read-only-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate read-only preflight script syntax
        run: node --check scripts/verify-arc-mainnet.mjs
