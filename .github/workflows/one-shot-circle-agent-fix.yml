name: One-shot Circle Agent Fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Circle Email Wallet agent mode
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/providers/wallet-provider.tsx')
          s = p.read_text()
          old = '''    // Security: Circle Email Wallets cannot securely derive an agent signing\n    // key (the mock provider returns a deterministic signature that anyone\n    // could recompute from the public address). Disable Auto-Agent for them.\n    if (usePilotStore.getState().walletType === "circle") {\n      setError(\n        "Auto-Agent is not available for Circle Email Wallets (an agent key cannot be securely derived for this wallet type). Connect a browser wallet such as Rabby to enable Auto-Agent.",\n      );\n      return;\n    }\n'''
          new = '''    // Circle Email Wallet is already a user-controlled smart wallet.\n    // Do not derive a second local/ZeroDev account from its provider.\n    // The agent must operate on the exact funded Circle wallet address.\n    if (usePilotStore.getState().walletType === "circle") {\n      try {\n        setConnecting(true);\n        const address = walletAddress.toLowerCase();\n        setActiveProvider(provider, {\n          uuid: "circle-pw",\n          name: "Circle Email Wallet",\n          address,\n          smartAccountAddress: address,\n        });\n        usePilotStore.getState().setAuthenticated(true);\n        setError(null);\n        alert("Auto-Agent enabled for your Circle Email Wallet. The agent will use this same smart-wallet address for Swap, Send and Bridge.");\n      } catch (e: any) {\n        setError(e?.message || "Failed to enable Circle Email Wallet agent mode.");\n      } finally {\n        setConnecting(false);\n      }\n      return;\n    }\n'''
          if old not in s:
              raise SystemExit('Expected Circle guard was not found; refusing to patch.')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/providers/wallet-provider.tsx')
          s = p.read_text()
          s = s.replace('''            address: restored.address.toLowerCase(),\n''', '''            address: restored.address.toLowerCase(),\n            smartAccountAddress: restored.address.toLowerCase(),\n''', 1)
          p.write_text(s)

          p = Path('src/components/wallet/wallet-modal.tsx')
          s = p.read_text()
          s = s.replace('''                  address: address.toLowerCase(),\n''', '''                  address: address.toLowerCase(),\n                  smartAccountAddress: address.toLowerCase(),\n''', 1)
          s = s.replace('''Auto-Agent is optional and creates a separate smart-account address when enabled.''', '''This same Circle smart-wallet address can be used by Auto-Agent.''', 1)
          p.write_text(s)

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/wallet-provider.tsx src/components/wallet/wallet-modal.tsx .github/workflows/one-shot-circle-agent-fix.yml
          git commit -m "fix(agent): allow Circle Email Wallet as agent smart wallet"
          git rm .github/workflows/one-shot-circle-agent-fix.yml
          git commit -m "chore: remove one-shot agent fix workflow"
          git push origin HEAD:master
