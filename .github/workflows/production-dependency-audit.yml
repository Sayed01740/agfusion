name: Production dependency security audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the controlled remediation branch head
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/audit-remediation-zod4-elliptic'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout --detach "refs/remotes/origin/${BRANCH}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts --no-audit
      - name: Preserve resolved candidate lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: candidate-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
      - run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        id: production_audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report development and transitive advisories
        if: always()
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node -e 'const r=require("/tmp/npm-audit-all.json"); for (const [name, v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({severity:v.severity, package:name, direct:v.isDirect, range:v.range, installedAt:v.nodes, fixAvailable:v.fixAvailable, advisories:(v.via || []).filter(x => typeof x === "object").map(x => ({title:x.title,url:x.url,range:x.range}))}));'
      - name: Commit the audited dependency lockfile
        if: steps.production_audit.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/audit-remediation-zod4-elliptic'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Resolved lockfile already committed."
          else
            git commit -m "chore: lock audited remediation dependencies"
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
      - name: Enforce production audit gate
        if: steps.production_audit.outcome == 'failure'
        run: |
          echo "::error::Production dependency audit failed. Review the detailed advisory report above; do not force breaking dependency changes just to clear the audit."
          exit 1
