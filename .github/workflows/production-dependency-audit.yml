name: Production dependency security audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report remaining development and transitive advisories
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node -e 'const r=require("/tmp/npm-audit-all.json"); for (const [name, v] of Object.entries(r.vulnerabilities || {})) console.log(`${v.severity}: ${name}; direct=${v.isDirect}; range=${v.range}; fix=${JSON.stringify(v.fixAvailable)}`);'
