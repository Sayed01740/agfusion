name: Production dependency security audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Audit all dependencies (production and development)
        id: production_audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Report development and transitive advisories
        if: always()
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node -e 'const r=require("/tmp/npm-audit-all.json"); for (const [name, v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({severity:v.severity, package:name, direct:v.isDirect, range:v.range, installedAt:v.nodes, fixAvailable:v.fixAvailable, advisories:(v.via || []).filter(x => typeof x === "object").map(x => ({title:x.title,url:x.url,range:x.range}))}));'
      - name: Enforce production audit gate
        if: steps.production_audit.outcome == 'failure'
        run: |
          echo "::error::Dependency security audit failed. Review the detailed advisory report above; do not force breaking dependency changes just to clear the audit."
          exit 1
