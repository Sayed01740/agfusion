name: Full dependency security audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Check npm registry signatures and provenance (diagnostic)
        continue-on-error: true
        run: npm audit signatures
      - name: Inspect exact @mapped/elliptic package metadata (diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          npm view @mapped/elliptic@6.6.10 dist --json > /tmp/mapped-elliptic-dist.json
          node <<'NODE'
          const fs = require("node:fs");
          const dist = JSON.parse(fs.readFileSync("/tmp/mapped-elliptic-dist.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const entry = lock.packages["node_modules/@ethersproject/signing-key/node_modules/elliptic"];
          console.log(JSON.stringify({
            package: "@mapped/elliptic",
            version: entry?.version,
            lockfileResolved: entry?.resolved,
            lockfileIntegrity: entry?.integrity,
            registryTarball: dist.tarball,
            registryIntegrity: dist.integrity,
            integrityMatches: Boolean(entry?.integrity && entry.integrity === dist.integrity),
            registrySignatureCount: Array.isArray(dist.signatures) ? dist.signatures.length : 0,
            provenanceAttestationPresent: Boolean(dist.attestations),
            attestationKeys: dist.attestations && typeof dist.attestations === "object"
              ? Object.keys(dist.attestations)
              : [],
          }, null, 2));
          NODE
      - name: Audit all dependencies (production and development)
        id: production_audit
        continue-on-error: true
        run: npm audit --audit-level=moderate
      - name: Report development and transitive advisories
        if: always()
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          node -e 'const r=require("/tmp/npm-audit-all.json"); for (const [name, v] of Object.entries(r.vulnerabilities || {})) console.log(JSON.stringify({severity:v.severity, package:name, direct:v.isDirect, range:v.range, installedAt:v.nodes, fixAvailable:v.fixAvailable, advisories:(v.via || []).filter(x => typeof x === "object").map(x => ({title:x.title,url:x.url,range:x.range}))}));'
      - name: Enforce full dependency audit gate
        if: steps.production_audit.outcome == 'failure'
        run: |
          echo "::error::Dependency security audit failed. Review the detailed advisory report above; do not force breaking dependency changes just to clear the audit."
          exit 1
