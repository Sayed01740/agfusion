<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AGFusion</title>
  <desc id="desc">AGFusion purple, indigo and cyan fusion mark with wordmark</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.45" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.45" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(165 45)">
    <path d="M125 410 L285 110 Q300 82 330 82 H410 Q440 82 455 110 L615 410 H520 L410 205 Q402 190 385 190 H355 Q338 190 330 205 L220 410 Z" fill="url(#mark)"/>
    <path d="M82 410 Q310 185 535 410 H450 Q310 315 170 410 Z" fill="url(#mark)" opacity="0.98"/>
    <path d="M176 365 Q310 270 444 365" fill="none" stroke="#A5F3FC" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  </g>
  <g font-family="Sora, Inter, Arial, sans-serif" font-weight="700" letter-spacing="-4">
    <text x="130" y="575" font-size="112" fill="url(#word)">AG</text>
    <text x="345" y="575" font-size="112" fill="url(#silver)">Fusion</text>
  </g>
  <path d="M132 616 H1068" stroke="url(#word)" stroke-width="2" opacity="0.35"/>
  <text x="600" y="655" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="7" fill="#94A3B8">INTELLIGENT MONEY · SEAMLESSLY</text>
</svg>
